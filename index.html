<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKL Console</title>
<style>
  :root{
    --brand:#ED6B1F; --brand-600:#D75E15;
    --bg:#E4EAE5; --surface:#FFFFFF; --line:#BFCAC2;
    --text:#16191D; --text-2:#565E6B; --text-3:#8A93A0; --danger:#B3261E;
    --r:12px; --r-lg:16px;
    --font:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);
    display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{max-width:760px;width:100%;text-align:center}
  .brand-logo{display:block;margin:0 auto 6px;height:72px;width:auto}
  .brand-name{text-align:center;font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--text-2);margin:0 0 18px}
  h1{font-size:26px;margin:0 0 8px;letter-spacing:-.02em}
  p.sub{color:var(--text-2);font-size:14.5px;margin:0 0 28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  a.tile{display:block;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--brand);box-shadow:0 2px 8px rgba(11,59,34,.12);border-radius:var(--r-lg);
    padding:26px 22px;text-decoration:none;color:var(--text);transition:.16s ease;text-align:left}
  a.tile:hover{border-color:var(--brand);box-shadow:0 8px 24px rgba(16,25,20,.08);transform:translateY(-2px)}
  .tile h3{margin:0;font-size:17px;color:#0F5132}
  .tile p{margin:0;font-size:13px;color:var(--text-3);line-height:1.5}
  .badge{display:inline-block;margin-top:12px;font-size:11px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;color:var(--brand-600)}
  footer{margin-top:34px;font-size:11.5px;color:var(--text-3)}
  .card{border-top:5px solid #0F5132;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px 24px;text-align:left;
    max-width:400px;margin:0 auto;box-shadow:0 10px 28px rgba(16,25,20,.06)}
  .card h2{margin:0 0 4px;font-size:18px}
  .card .hint{font-size:12.5px;color:var(--text-3);margin:0 0 16px;line-height:1.5}
  label{display:block;font-size:12.5px;font-weight:600;margin:12px 0 5px;color:var(--text-2)}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14.5px;background:#fff}
  input:focus{outline:2px solid rgba(237,107,31,.35);border-color:var(--brand)}
  button{font:inherit;cursor:pointer}
  .btn{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:var(--brand);color:#fff;font-weight:700;font-size:14.5px}
  .btn:hover{background:var(--brand-600)} .btn:disabled{opacity:.6;cursor:default}
  .linkbtn{background:none;border:0;color:var(--text-2);font-size:13px;text-decoration:underline;padding:4px 8px}
  .err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px}
  .notice{background:#FFF4EC;border:1px solid #F7D3BB;color:#8A3B0C;border-radius:8px;padding:10px 12px;font-size:13px;margin:0 auto 16px;max-width:400px;text-align:left}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 22px;font-size:13px;color:var(--text-2);flex-wrap:wrap}
  .bar .who{font-size:20px;color:var(--text-2)}
  .bar .who strong{color:#0F5132;font-size:24px;letter-spacing:-.01em}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <img class="brand-logo" src="logo.png" alt="Orange Kalbe Limited" width="106" height="67">
  <div class="brand-name">ORANGE KALBE LIMITED</div>
  
  <div id="notice" class="notice hidden"></div>

  <!-- not signed in -->
  <section id="loginView" class="hidden">
    <p class="sub">Sign in to continue.</p>
    <form class="card" id="loginForm" novalidate>
      <h2>Sign in</h2>
      <p class="hint">Use your work email and password.</p>
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="username" placeholder="you@orangegroups.ng">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <div class="err" id="loginErr"></div>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </section>

  <!-- must / may change password -->
  <section id="pwView" class="hidden">
    <p class="sub" id="pwSub"></p>
    <form class="card" id="pwForm" novalidate>
      <h2>Change password</h2>
      <p class="hint">At least 8 characters. It cannot be the default password.</p>
      <label for="oldPw">Current password</label>
      <input id="oldPw" type="password" autocomplete="current-password">
      <label for="newPw">New password</label>
      <input id="newPw" type="password" autocomplete="new-password">
      <label for="newPw2">Repeat new password</label>
      <input id="newPw2" type="password" autocomplete="new-password">
      <div class="err" id="pwErr"></div>
      <button class="btn" type="submit">Save password</button>
      <div style="text-align:center;margin-top:10px"><button type="button" class="linkbtn hidden" id="pwCancel">Cancel</button>
        <button type="button" class="linkbtn" id="pwSignOut">Sign out</button></div>
    </form>
  </section>

  <!-- signed in -->
  <section id="homeView" class="hidden">
    <div class="bar">
      <div class="who">Welcome, <strong id="whoName"></strong></div>
      <div><button class="linkbtn" id="changePw">Change password</button><button class="linkbtn" id="signOut">Sign out</button></div>
    </div>
    
    <div class="grid">
      <a class="tile" href="employees/">
        <h3>Employees</h3>
      </a>
      <a class="tile" href="qsync/">
        <h3>QSync</h3>
      </a>
      <a class="tile" href="procurement/">
        <h3>Procurement</h3>
      </a>
      <a class="tile hidden" id="usersTile" href="users/">
        <h3>Users</h3>
      </a>
      <a class="tile" href="https://orange-group-okl-production-system.vercel.app" target="_blank" rel="noopener">
        <h3>Live production system</h3>
      </a>
      <a class="tile" href="https://orangegroupsai.online/webhook/zaiki-mintacid-dashboard" target="_blank" rel="noopener">
        <h3>Zaiki &amp; Mintacid</h3>
      </a>
    </div>
  </section>
</div>

<script>
(function(){
  var API = 'https://orangegroupsai.online/webhook/auth/api/';
  var KEY = 'okl.token';
  var memToken = '';
  var me = null, forced = false, idleTimer = null;
  function $(id){ return document.getElementById(id); }
  function getToken(){ try { return sessionStorage.getItem(KEY) || memToken; } catch(e){ return memToken; } }
  function setToken(t){ memToken = t || ''; try { if (t) sessionStorage.setItem(KEY, t); else sessionStorage.removeItem(KEY); } catch(e){} }
  function show(id){ ['loginView','pwView','homeView'].forEach(function(v){ $(v).classList.toggle('hidden', v !== id); }); }

  async function call(path, method, body){
    var headers = { 'Content-Type': 'application/json' };
    var t = getToken(); if (t) headers['Authorization'] = t;
    var res;
    try { res = await fetch(API + path, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined }); }
    catch(e){ throw new Error('Could not reach the server. Check your connection and try again.'); }
    var json = {}; try { json = await res.json(); } catch(e){}
    if (!res.ok){ var err = new Error(json.error || 'Something went wrong.'); err.status = res.status; throw err; }
    return json;
  }

  function resetIdle(){
    if (!me) return;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ signOut('Signed out after 10 minutes of inactivity.'); }, 10 * 60 * 1000);
  }
  ['click','keydown','mousemove','touchstart'].forEach(function(e){ document.addEventListener(e, resetIdle, { passive: true }); });

  function notice(msg){ var n = $('notice'); if (!msg){ n.classList.add('hidden'); return; } n.textContent = msg; n.classList.remove('hidden'); }

  async function signOut(reason){
    try { await call('logout', 'POST'); } catch(e){}
    setToken(''); me = null; clearTimeout(idleTimer);
    showLogin(reason);
  }
  function showLogin(msg){
    notice(msg || '');
    $('password').value = ''; $('loginErr').textContent = '';
    show('loginView');
  }
  function showHome(){
    notice('');
    $('whoName').textContent = me.user.name;
    $('usersTile').classList.toggle('hidden', !me.user.is_admin);
    show('homeView'); resetIdle();
  }
  function showPassword(force){
    forced = force;
    $('pwSub').textContent = force ? 'You need to choose a new password before you continue.' : 'Choose a new password.';
    ['oldPw','newPw','newPw2'].forEach(function(i){ $(i).value = ''; }); $('pwErr').textContent = '';
    $('pwCancel').classList.toggle('hidden', force);
    show('pwView');
  }
  async function load(){
    try { me = await call('me', 'GET'); }
    catch(e){ setToken(''); me = null; showLogin(e.status === 401 ? '' : e.message); return; }
    if (me.user.must_change) showPassword(true); else showHome();
  }

  $('loginForm').addEventListener('submit', async function(ev){
    ev.preventDefault();
    var email = $('email').value.trim(), password = $('password').value;
    $('loginErr').textContent = '';
    if (!email || !password){ $('loginErr').textContent = 'Enter your email and password.'; return; }
    var btn = ev.target.querySelector('button[type=submit]'); btn.disabled = true;
    try { var r = await call('login', 'POST', { email: email, password: password }); setToken(r.token); await load(); }
    catch(e){ $('loginErr').textContent = e.message; }
    finally { btn.disabled = false; }
  });
  $('pwForm').addEventListener('submit', async function(ev){
    ev.preventDefault();
    var o = $('oldPw').value, n = $('newPw').value, n2 = $('newPw2').value;
    $('pwErr').textContent = '';
    if (!o) { $('pwErr').textContent = 'Enter your current password.'; return; }
    if (n.length < 8) { $('pwErr').textContent = 'The new password must be at least 8 characters.'; return; }
    if (n !== n2) { $('pwErr').textContent = 'The two new passwords do not match.'; return; }
    var btn = ev.target.querySelector('button[type=submit]'); btn.disabled = true;
    try { await call('change-password', 'POST', { old_password: o, new_password: n }); await load(); notice('Password changed.'); }
    catch(e){ $('pwErr').textContent = e.message; if (e.status === 401) { setToken(''); showLogin('Your session has expired. Please sign in again.'); } }
    finally { btn.disabled = false; }
  });
  $('changePw').onclick = function(){ showPassword(false); };
  $('pwCancel').onclick = function(){ showHome(); };
  $('pwSignOut').onclick = function(){ signOut(); };
  $('signOut').onclick = function(){ signOut(); };

  var pending = null;
  try { pending = sessionStorage.getItem('okl.notice'); sessionStorage.removeItem('okl.notice'); } catch(e){}
  if (getToken()) { load().then(function(){ if (pending) notice(pending); }); }
  else showLogin(pending || '');
})();
</script>
</body>
</html>
